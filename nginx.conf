server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;

  # fingerprinted build files and fonts never change under the same name
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /fonts/  { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /downloads/ { add_header Cache-Control "public, max-age=3600"; }
}
